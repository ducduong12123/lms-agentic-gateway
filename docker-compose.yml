name: lms-agentic

services:
  engine:
    build: .
    env_file:
      - .env
    environment:
      GATEWAY_HOST: 0.0.0.0
      FRAPPE_URL: http://frappe:8000
      FRAPPE_SITE_HOST: lms.localhost
      PUBLIC_ORIGINS: http://localhost:8080,http://lms.localhost:8080
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:20128/v1}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8001:8001
    volumes:
      - ./data:/app/data
    networks:
      - lms
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - engine
    ports:
      - 8080:8080
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lms
    restart: unless-stopped

networks:
  lms:
    external: true
    name: lms_default
