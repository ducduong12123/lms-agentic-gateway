[project]
name = "lms_copilot"
authors = [
    { name = "LMS Copilot contributors" }
]
description = "Agentic Learning Copilot tools, proposals and approval flow for Frappe Learning"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
