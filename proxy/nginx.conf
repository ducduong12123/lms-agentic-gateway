map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 50m;

    # The integrated entry point is the LMS SPA, not Frappe's root login page.
    # Keep the public port convenient and avoid exposing the ambiguous root route.
    location = / {
        return 302 /lms;
    }

    location ^~ /ai/ {
        proxy_pass http://engine:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ^~ /lms {
        proxy_pass http://frappe:8000;
        proxy_http_version 1.1;
        proxy_set_header Host lms.localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</body>' '<script src="/ai/widget.js" defer></script></body>';
    }

    location / {
        proxy_pass http://frappe:8000;
        proxy_http_version 1.1;
        proxy_set_header Host lms.localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
