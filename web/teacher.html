<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Teacher Console</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#1f2724;background:#f8faf9}body{margin:0}.bar{height:58px;background:#fff;border-bottom:1px solid #e5e9e7;display:flex;align-items:center;padding:0 5vw;font-weight:650;color:#087a60}.wrap{max-width:1100px;margin:32px auto;padding:0 24px}.tools{display:flex;gap:8px;margin:20px 0}input{border:1px solid #ccd6d1;border-radius:8px;padding:10px 12px;min-width:280px}button{border:0;border-radius:8px;background:#087a60;color:white;padding:10px 14px;font-weight:650;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #e2e8e5;border-radius:12px;padding:18px}.item{border-top:1px solid #edf0ef;padding:13px 0}.tag{font-size:11px;border-radius:12px;background:#edf8f4;color:#087a60;padding:3px 8px}.muted{color:#68756f;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="bar">Learning · AI Teacher Console</div><main class="wrap"><a href="/lms">← Learning</a><h1>Duyệt learner model</h1><div class="tools"><input id="course" placeholder="Tên course, ví dụ PY-101"><button id="load">Tải dữ liệu</button></div><div class="grid"><section class="panel"><h2>Concept nháp</h2><div id="concepts" class="muted">Nhập course để tải.</div></section><section class="panel"><h2>Học viên có rủi ro</h2><div id="risk" class="muted">Nhập course để tải.</div></section></div></main>
<script>
const api='/ai';async function refresh(){const c=encodeURIComponent(course.value.trim());if(!c)return;const [a,b]=await Promise.all([fetch(api+'/concepts?status=draft&course='+c),fetch(api+'/teacher/risk?course='+c)]);const cd=await a.json(),rd=await b.json();concepts.innerHTML=(cd.concepts||[]).map(x=>`<div class="item"><b>${x.label}</b> <span class="tag">${x.status}</span><p class="muted">${x.description||'Chưa có mô tả'}</p><button onclick="approve('${x.id}')">Duyệt concept</button></div>`).join('')||'Không có concept nháp.';risk.innerHTML=(rd.students||[]).map(x=>`<div class="item"><b>${x.member}</b><p class="muted">${x.reasons.join(' · ')}</p></div>`).join('')||'Chưa có tín hiệu rủi ro.'}async function approve(id){await fetch(api+'/concepts/'+encodeURIComponent(id)+'/approve',{method:'POST'});refresh()}load.onclick=refresh;
</script></body></html>
