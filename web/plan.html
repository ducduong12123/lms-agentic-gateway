<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kế hoạch học tập</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#1f2724;background:#f8faf9}body{margin:0}.bar{height:58px;background:#fff;border-bottom:1px solid #e5e9e7;display:flex;align-items:center;padding:0 7vw;font-weight:650;color:#087a60}.wrap{max-width:900px;margin:42px auto;padding:0 24px}h1{font-size:28px;margin-bottom:8px}.muted{color:#68756f}.card{background:white;border:1px solid #e2e8e5;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 2px 8px #173b2f0a}.date{font-size:12px;color:#087a60;font-weight:700;text-transform:uppercase}.pref{display:flex;gap:12px;align-items:center;background:#edf8f4;padding:14px 16px;border-radius:10px}button{border:0;border-radius:8px;background:#087a60;color:#fff;padding:9px 14px;font-weight:650;cursor:pointer}a{color:#087a60}</style></head>
<body><div class="bar">Learning · AI Engine</div><main class="wrap"><a href="/lms">← Learning</a><h1>Kế hoạch 15 phút</h1><p class="muted">Kế hoạch dựa trên evidence và concept đã được giáo viên duyệt.</p><div class="pref"><input id="opt" type="checkbox"><label for="opt">Nhận kế hoạch hằng ngày qua chuông thông báo LMS</label><button id="save">Lưu</button></div><div id="plans"></div></main>
<script>
const api='/ai';async function load(){const r=await fetch(api+'/plans/me');if(!r.ok)return;const d=await r.json();opt.checked=!!d.preferences.daily_plan_opt_in;plans.innerHTML=d.plans.length?d.plans.map(p=>`<article class="card"><div class="date">${p.plan_date}</div><p>${p.content}</p></article>`).join(''):'<div class="card muted">Chưa có kế hoạch. Bật nhận kế hoạch để engine tạo vào 07:00.</div>'}save.onclick=async()=>{await fetch(api+'/preferences',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({daily_plan_opt_in:opt.checked,quiet_hours:''})});load()};load();
</script></body></html>
